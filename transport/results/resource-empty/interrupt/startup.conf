unix { nodaemon runtime-dir /tmp/vcl-resources-empty-1/interrupt cli-listen /tmp/vcl-resources-empty-1/interrupt/cli.sock }
cpu { main-core 0 }
memory { main-heap-size 256M main-heap-page-size default }
buffers { buffers-per-numa 4096 page-size default }
statseg { socket-name /tmp/vcl-resources-empty-1/interrupt/stats.sock size 32M page-size default }
socksvr { socket-name /tmp/vcl-resources-empty-1/interrupt/api.sock }
session { enable use-app-socket-api }
plugins { plugin default { disable } }
