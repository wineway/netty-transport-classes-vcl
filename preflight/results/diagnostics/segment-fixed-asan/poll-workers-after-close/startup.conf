unix { nodaemon runtime-dir /tmp/vcl26-fix-regression/poll-workers-after-close cli-listen /tmp/vcl26-fix-regression/poll-workers-after-close/cli.sock }
cpu { main-core 0 }
memory { main-heap-size 256M main-heap-page-size default }
buffers { buffers-per-numa 4096 page-size default }
statseg { socket-name /tmp/vcl26-fix-regression/poll-workers-after-close/stats.sock size 32M page-size default }
socksvr { socket-name /tmp/vcl26-fix-regression/poll-workers-after-close/api.sock }
session { enable use-app-socket-api }
plugins { plugin default { disable } }
