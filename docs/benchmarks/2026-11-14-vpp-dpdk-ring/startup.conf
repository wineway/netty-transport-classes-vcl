unix { nodaemon cli-listen /code-repos/netty-transport-classes-vcl/target/vr-probe/cli.sock runtime-dir /code-repos/netty-transport-classes-vcl/target/vr-probe/run }
cpu { main-core 2 }
plugins { path /tmp/netty-vcl-deps/vpp/usr/lib/x86_64-linux-gnu/vpp_plugins plugin default { disable } plugin dpdk_plugin.so { enable } plugin ping_plugin.so { enable } }
buffers { buffers-per-numa 8192 default data-size 2048 }
dpdk { no-pci mem-alloc-request 256 no-hugetlb no-shconf file-prefix netty-vpp-ring vdev net_ring0 }
