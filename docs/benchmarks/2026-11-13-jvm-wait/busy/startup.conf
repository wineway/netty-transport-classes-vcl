unix { nodaemon cli-listen /code-repos/netty-transport-classes-vcl/target/d-busy/cli.sock runtime-dir /code-repos/netty-transport-classes-vcl/target/d-busy/vpp }
cpu { main-core 2 }
api-segment { prefix netty-vcl-bench }
statseg { socket-name /code-repos/netty-transport-classes-vcl/target/d-busy/stats.sock }
plugins { path /tmp/netty-vcl-deps/vpp/usr/lib/x86_64-linux-gnu/vpp_plugins plugin default { disable } plugin af_packet_plugin.so { enable } }
session { enable use-app-socket-api evt_qs_memfd_seg }
buffers { buffers-per-numa 1024 default data-size 2048 }
