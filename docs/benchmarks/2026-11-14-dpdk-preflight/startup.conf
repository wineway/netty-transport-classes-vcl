unix { nodaemon cli-listen /tmp/netty-dpdk-probe-cli.sock runtime-dir /tmp/netty-dpdk-probe }
cpu { main-core 2 }
plugins { path /tmp/netty-vcl-deps/vpp/usr/lib/x86_64-linux-gnu/vpp_plugins plugin default { disable } plugin dpdk_plugin.so { enable } }
buffers { buffers-per-numa 1024 default data-size 2048 }
dpdk { no-pci no-hugetlb no-shconf file-prefix netty-dpdk-probe vdev net_af_packet0,iface=nvserver }
